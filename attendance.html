<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi | Absensi Kelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- MENU / SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Absensi Kelas</h2>
                <p>Panel Kehadiran Siswa</p>
            </div>
            <nav class="menu">
                <a href="index.html">Dashboard</a>
                <a href="attendance.html" class="active">Absensi</a>
                <a href="history.html">Data & Riwayat</a>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="main-content">
            <h2>Absensi Siswa</h2>
            <p>Pilih tanggal dan atur status kehadiran setiap siswa.</p>

            <div class="form-container">
                <div class="filter-section">
                    <label>Tanggal absensi</label>
                    <input type="date" id="attendanceDate">
                    
                    <label>Cari siswa</label>
                    <input type="text" id="searchStudent" placeholder="Ketik nama siswa...">
                    
                    <button id="allPresentBtn" type="button">Semua Hadir</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Siswa</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <!-- Nama siswa akan otomatis dimuat oleh script.js di sini -->
                    </tbody>
                </table>

                <p id="saveMessage"></p>
                <button id="saveBtn" type="button">Simpan Absensi</button>
            </div>
        </main>
    </div>

    <!-- PENTING: Penghubung ke file script.js -->
    <script src="script.js"></script>
</body>
</html>
